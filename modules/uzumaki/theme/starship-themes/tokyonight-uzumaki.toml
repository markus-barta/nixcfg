# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                     STARSHIP PROMPT - __HOSTNAME__ (__PALETTE_NAME__)
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Theme: __PALETTE_NAME__ (__CATEGORY__)
# Palette Key: __PALETTE_KEY__
# Auto-generated by: modules/uzumaki/theme/theme-hm.nix
#
# Features:
#   - Powerline gradient (__PALETTE_NAME__ spectrum)
#   - Root alert (red warning segment)
#   - Exit status badge (on error)
#   - Fish-native right rail (no second right-prompt invocation)
#   - Command duration (> 2s)
#   - Background jobs indicator
#   - Success/error character prompt
#   - Fish-native metrics (CPU, RAM, Load, Swap) via StaSysMo
#

"$schema" = 'https://starship.rs/config-schema.json'

# Built-in git_commit removes the slow custom shell command.
command_timeout = 500
add_newline = false

# ════════════════════════════════════════════════════════════════════════════════
# PROMPT FORMAT
# ════════════════════════════════════════════════════════════════════════════════
#
# Left side: Rounded RIGHT arrows (__PL_RIGHT_SOFT__) for transitions
# Right side: Rounded LEFT arrow (__PL_LEFT_SOFT__) to START, then RIGHT arrows (__PL_RIGHT_SOFT__)
#

# Default is left-only for bash/zsh and the compositor kill switch.
format = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$jobs$git_branch$git_status$git_commit[__PL_RIGHT_SOFT__](fg:__MIDDARK__ bg:__DARK__)$nodejs$python$rust$golang$php$docker_context[__PL_RIGHT_SOFT__](fg:__DARK__)\n$character"

[profiles]
stasysmo_0 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$jobs$git_branch$git_status$git_commit[__PL_RIGHT_SOFT__](fg:__MIDDARK__ bg:__DARK__)$nodejs$python$rust$golang$php$docker_context[__PL_RIGHT_SOFT__](fg:__DARK__)\n$time\n$character"
stasysmo_1 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$jobs$git_branch$git_status$git_commit[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_2 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$jobs$git_branch$git_status[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_3 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__MIDDARK__)$jobs$git_branch$git_status[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_4 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__MIDDARK__)$git_branch$git_status[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_5 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__MIDDARK__)$git_branch[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_6 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__)\n$time\n$character"
stasysmo_7 = "[__PL_LEFT_SOFT__](fg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__)\n$time\n$character"
stasysmo_ssh_3 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$jobs$git_branch$git_status[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_ssh_4 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$git_branch$git_status[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_ssh_5 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__ bg:__MIDDARK__)$git_branch[__PL_RIGHT_SOFT__](fg:__MIDDARK__)\n$time\n$character"
stasysmo_ssh_6 = "[░▒▓](__LIGHTEST__)$os[__PL_RIGHT_SOFT__](fg:__LIGHTEST__ bg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__)\n$time\n$character"
stasysmo_ssh_7 = "[__PL_LEFT_SOFT__](fg:__PRIMARY__)$directory[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__)\n$time\n$character"
stasysmo_short = "[__PL_LEFT_SOFT__](fg:__PRIMARY__)${env_var.STASYSMO_DIRECTORY}[__PL_RIGHT_SOFT__](fg:__PRIMARY__)\n$time\n$character"
stasysmo_ssh_short = "[__PL_LEFT_SOFT__](fg:__PRIMARY__)${env_var.STASYSMO_DIRECTORY}[__PL_RIGHT_SOFT__](fg:__PRIMARY__ bg:__SECONDARY__)$username$hostname[__PL_RIGHT_SOFT__](fg:__SECONDARY__)\n$time\n$character"

[env_var.STASYSMO_DIRECTORY]
format = "[ $env_value ](fg:__TEXT_ON_MEDIUM__ bg:__PRIMARY__)"

# OS icon and left-chain modules. Root/rail segments are fish-native.

[os]
disabled = false
style = "bg:__LIGHTEST__ fg:__TEXT_ON_LIGHTEST__"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = ""
NixOS = ""
Linux = ""

# ════════════════════════════════════════════════════════════════════════════════
# DIRECTORY
# ════════════════════════════════════════════════════════════════════════════════

[directory]
style = "fg:__TEXT_ON_MEDIUM__ bg:__PRIMARY__"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# ════════════════════════════════════════════════════════════════════════════════
# USERNAME & HOSTNAME
# ════════════════════════════════════════════════════════════════════════════════

[username]
show_always = true
style_user = "fg:__TEXT_ON_SECONDARY__ bg:__SECONDARY__"
style_root = "fg:__ROOT_BG__ bg:__SECONDARY__"
format = '[ $user]($style)'

[hostname]
ssh_only = false
style = "fg:__TEXT_ON_SECONDARY__ bg:__SECONDARY__"
format = '[@$hostname ]($style)'

# ════════════════════════════════════════════════════════════════════════════════
# JOBS (Background processes)
# ════════════════════════════════════════════════════════════════════════════════

[jobs]
symbol = "✦"
style = "fg:__TEXT_ACCENT__ bg:__MIDDARK__"
number_threshold = 1
format = '[[ $symbol$number ](fg:__TEXT_ACCENT__ bg:__MIDDARK__)]($style)'

# ════════════════════════════════════════════════════════════════════════════════
# GIT
# ════════════════════════════════════════════════════════════════════════════════

[git_branch]
symbol = ""
style = "bg:__MIDDARK__"
format = '[[ $symbol $branch ](fg:__TEXT_ACCENT__ bg:__MIDDARK__)]($style)'

[git_status]
style = "bg:__MIDDARK__"
format = '[[($all_status$ahead_behind )](fg:__TEXT_ACCENT__ bg:__MIDDARK__)]($style)'


[git_commit]
only_detached = false
commit_hash_length = 7
tag_disabled = true
style = "fg:__TEXT_MUTED__ bg:__MIDDARK__"
format = "[#$hash ]($style)"

# ════════════════════════════════════════════════════════════════════════════════
# LANGUAGES
# ════════════════════════════════════════════════════════════════════════════════

[nodejs]
symbol = ""
style = "bg:__DARK__"
format = '[[ $symbol ($version) ](fg:__TEXT_ACCENT__ bg:__DARK__)]($style)'

[python]
symbol = ""
style = "bg:__DARK__"
format = '[[ $symbol ($version) ](fg:__TEXT_ACCENT__ bg:__DARK__)]($style)'

[rust]
symbol = ""
style = "bg:__DARK__"
format = '[[ $symbol ($version) ](fg:__TEXT_ACCENT__ bg:__DARK__)]($style)'

[golang]
symbol = ""
style = "bg:__DARK__"
format = '[[ $symbol ($version) ](fg:__TEXT_ACCENT__ bg:__DARK__)]($style)'

[php]
symbol = ""
style = "bg:__DARK__"
format = '[[ $symbol ($version) ](fg:__TEXT_ACCENT__ bg:__DARK__)]($style)'

[docker_context]
symbol = ""
style = "bg:__DARK__"
format = '[[ $symbol $context ](fg:__TEXT_ACCENT__ bg:__DARK__)]($style)'
only_with_files = true

# Fish profiles reuse this field for now + clock, without a date process.
[time]
disabled = false
time_format = "%s %T"
format = "$time"

# Input line (also used by the left-only default).
[character]
success_symbol = "[❯](bold fg:__TEXT_ACCENT__)"
error_symbol = "[✗](bold fg:__ERROR_BG__)"
