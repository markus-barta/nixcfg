# OPS-508 — the Pharos fleet overview page, served by hsb0-home; same pattern as /videos/ (OPS-380).
#
# Included inside the HostDash server block (modules/files/hostdash-nginx.conf, include point
# /etc/nginx/hostdash-extra/*.conf). hsb0 has no port forward: LAN + tailnet only.
# Content: one self-contained index.html in /var/lib/pharosfleet (mba, 0755), pushed from mbp2607
# by scripts/pharosfleet/publish.sh in the ops repo (scp to .index.html.tmp, then mv).
# Dotfiles, including that temp file, are never served.

location = /pharosfleet {
    absolute_redirect off;
    return 301 /pharosfleet/;
}

location /pharosfleet/ {
    alias /srv/pharosfleet/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        return 404;
    }
}
