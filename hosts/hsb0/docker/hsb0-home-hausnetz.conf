# HNET-237 / OPS-207 — included inside this host's front-page server block.
# GET/HEAD bookmarks move to /; old API writes retain their method and body.
location = /ops {
    allow 192.168.1.0/24;
    deny all;
    # try_files runs after access checks; a direct return bypasses allow/deny.
    try_files "" @hausnetz_ops_redirect;
}

location /ops/ {
    allow 192.168.1.0/24;
    deny all;
    # The internal rewrite re-enters the root location's own body-size check.
    client_max_body_size 257m;
    try_files "" @hausnetz_ops_redirect;
}

location @hausnetz_ops_redirect {
    absolute_redirect off;
    # Access checks already ran. A 301 must never discard a legacy POST body.
    if ($request_method !~ ^(GET|HEAD)$) {
        rewrite ^/ops(?:/(.*))?$ /$1 last;
    }
    # Use the raw URI: keep percent escapes and the entire query byte-for-byte.
    # Strip repeated leading slashes too, so Location cannot become //other-host.
    if ($request_uri ~ "^/ops(?:/+)?(.*)$") {
        return 301 /$1;
    }
    return 404;
}

# OPS-355: raw application/zip body capped at 256 MiB, including legacy imports.
location = /api/import {
    allow 192.168.1.0/24;
    deny all;
    client_max_body_size 257m;
    proxy_pass http://host.docker.internal:8377/api/import;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}

location / {
    allow 192.168.1.0/24;
    deny all;
    client_max_body_size 13m;
    proxy_pass http://host.docker.internal:8377/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}
