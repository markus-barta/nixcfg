# OPS-207 — included inside the HostDash server block. The trailing slash
# strips /ops/; hausnetz's assets, API and EventSource use relative URLs.
location = /ops {
    allow 192.168.1.0/24;
    deny all;
    # try_files runs after access checks; a direct return bypasses allow/deny.
    try_files "" @hausnetz_ops_redirect;
}

location @hausnetz_ops_redirect {
    absolute_redirect off;
    return 301 /ops/;
}

# OPS-355: raw application/zip body capped at 256 MiB; strip /ops as below.
location = /ops/api/import {
    allow 192.168.1.0/24;
    deny all;
    client_max_body_size 257m;
    proxy_pass http://host.docker.internal:8377/api/import;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}

location /ops/ {
    allow 192.168.1.0/24;
    deny all;
    client_max_body_size 13m;
    proxy_pass http://host.docker.internal:8377/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
}
