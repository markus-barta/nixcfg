# OPS-353 — Markus's "In-flight" page (AEON-LEAD's progress overview), served by hsb0-home.
#
# Included inside the HostDash server block (modules/files/hostdash-nginx.conf, include point
# /etc/nginx/hostdash-extra/*.conf). hsb0 has no port forward: LAN + tailnet only.
# Content: one index.html in /var/lib/inflight (mba, 0755), pushed from mbp2607 atomically
# (scp to .index.html.tmp, then mv). Dotfiles, including that temp file, are never served.

location = /inflight {
    absolute_redirect off;
    return 301 /inflight/;
}

location /inflight/ {
    alias /srv/inflight/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        return 404;
    }
}
