# OPS-380 — the video overview page (VID, AEON-1480), served by hsb0-home; same pattern as /inflight/ (OPS-353).
#
# Included inside the HostDash server block (modules/files/hostdash-nginx.conf, include point
# /etc/nginx/hostdash-extra/*.conf). hsb0 has no port forward: LAN + tailnet only.
# Content: one self-contained index.html in /var/lib/videos (mba, 0755), pushed from mbp2607 atomically
# (scp to .index.html.tmp, then mv). Dotfiles, including that temp file, are never served.

location = /videos {
    absolute_redirect off;
    return 301 /videos/;
}

location /videos/ {
    alias /srv/videos/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        return 404;
    }
}
