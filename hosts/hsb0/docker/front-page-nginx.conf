# HNET-237: host-local override of modules/files/hostdash-nginx.conf.
# Only this host moves its front page; existing specific locations stay intact.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # HNET-237: hausnetz owns the root via hostdash-extra/hausnetz.conf.
    # HostDash's styles/icons are inline; its only resources are relative.
    location = /hostdash {
        absolute_redirect off;
        return 301 /hostdash/$is_args$args;
    }
    location /hostdash/ {
        alias /usr/share/nginx/html/;
        autoindex off;
    }
    location /hostdash/status/ {
        alias /srv/hostdash-status/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }
    # Compatibility for already-open boards; /status/ below is unchanged.
    location = /config.js { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }

    # NIX-280 — host-generated runtime truth: which containers and units are actually
    # running. Written atomically every 60s by hostdash-status.service.
    #
    # no-store: this is liveness data. A cached status file is a LYING status file,
    # and the freshness contract (HostDash treats a stale `generated` as UNKNOWN,
    # never as healthy) only works if the browser is actually re-fetching it.
    location /status/ {
        alias /srv/hostdash-status/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }

    # OPS-353 — per-host extra locations. Empty by default: nginx accepts a glob that
    # matches nothing, so a host that mounts no snippet serves exactly what it did before.
    # A host adds one by mounting a file into /etc/nginx/hostdash-extra/ (hsb0: /inflight/).
    include /etc/nginx/hostdash-extra/*.conf;

}
