# hsb8 docker services.
# fleetcom-agent migrated from /opt/fleetcom-agent/ on 2026-04-19 (NIX-82).
# homeassistant/mosquitto/watchtower migrated from /home/gb/docker/ (NIX-230,
# NIX-234) — same container names + project so bosun wiring keeps working.
#
# The NIX-237 cutover is DONE: the live homeassistant/mosquitto containers are
# created from THIS file, with the /srv/hsb8 mounts NIX-236 moved them to.
# Verified on the host 2026-07-31 (compose project_dir + config_files labels).
# The former cutover guard is removed rather than kept as history — it outlived
# the condition it described by long enough to mislead: reading it during the
# OPS-113 sweep caused homeassistant to be skipped on this host, leaving it the
# only host-network container in the fleet still on an inherited resolver.
#
# Docker copies the host's /etc/resolv.conf into a container ONCE, at container
# start, and never refreshes it, so a resolver-policy change silently strands
# every container already running. OPS-109 did that fleet-wide on 2026-07-29:
# hsb1 lost the access gate for two days and hsb0's pharos-beacon was still
# stranded when it was found (OPS-113). This host escaped only because it
# happened to restart afterwards. Home Assistant is host-network here, and a
# stranded HA is exactly how the Tesla integration died for four days
# (OPS-101) — so pinning matters more here than the current clean state suggests.
#
# Only for `network_mode: host` services. Bridge-network containers must keep
# Docker's embedded resolver (127.0.0.11), which forwards to the host file at
# query time and is never stranded. 127.0.0.1 is correct ONLY because these are
# host-network: it is the HOST's loopback, i.e. the local AdGuard Home.
#
# 🔴 hosts/hsb8/configuration.nix picks `dnsServers` and `search` CONDITIONALLY
# on `location`. These values are the ww87 (parents' home) branch, which is
# where this host lives. Compose cannot express that conditional, so if hsb8
# ever moves back to jhw22 these two lines must change with it — see OPS-114
# for generating them from Nix instead of hand-duplicating.
x-host-dns: &host-dns
  - 127.0.0.1 # ww87: local AdGuard Home on this host
  - 1.1.1.1 # Cloudflare fallback
x-host-dns-search: &host-dns-search
  - local # ww87 branch; jhw22 would be "lan"

services:
  # Pharos beacon (PHAROS-6) — reports this host's status + nix freshness to
  # pharosd (csb1) every 60s; succeeds the FleetCom bosun agent above.
  pharos-beacon:
    image: ghcr.io/inspr-at/pharos/pharosd:0.1.67@sha256:f1e9f37b1b989109f66c5fe00f8371ca49e00d0ccf5f0dede4b4b49abfad0c26
    container_name: pharos-beacon
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.5"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    network_mode: host
    dns: *host-dns
    dns_search: *host-dns-search
    user: "1000:1000"
    entrypoint: ["/usr/local/bin/pharos-beacon"]
    healthcheck:
      disable: true
    env_file:
      - /run/agenix/pharos-beacon-hsb8-env
    environment:
      - PHAROS_URL=http://100.64.0.4:8088
      - PHAROS_INTERVAL=60
      - PHAROS_HOSTNAME=hsb8
      - PHAROS_PREFERENCES_FILE=/etc/pharos/host-preferences.json
      - PHAROS_CURRENT_KERNEL_MODULES_DIR=/host/run/current-system/kernel-modules/lib/modules
      - NIXCFG_DIR=/nixcfg
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/nixcfg
    volumes:
      - /home/mba/Code/nixcfg:/nixcfg:ro
      - /etc/NIXOS:/etc/NIXOS:ro
      - /etc/pharos/host-preferences.json:/etc/pharos/host-preferences.json:ro
      - /run/current-system/kernel-modules/lib/modules:/host/run/current-system/kernel-modules/lib/modules:ro
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - com.centurylinklabs.watchtower.scope=weekly

  # hsb8-home — HostDash service landing page for this host. Static HTML/CSS/JS
  # served by nginx on :80, built from markus-barta/hostdash via Nix and mounted
  # read-only from /etc.
  hsb8-home:
    image: nginx:alpine
    container_name: hsb8-home
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Vienna
    volumes:
      - /etc/hostdash/hsb8/share/hostdash-hsb8:/usr/share/nginx/html:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=weekly

  # ── Migrated from /home/gb/docker/docker-compose.yml (NIX-234) ────────────
  # Data lives under /srv/hsb8/mounts (neutral path, no user home — NIX-236
  # moves it there before cutover, NIX-237 does the cutover).

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    dns: *host-dns
    dns_search: *host-dns-search
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Europe/Vienna
    volumes:
      - /srv/hsb8/mounts/homeassistant:/config
      - /run/dbus:/run/dbus:rw
      - /sys/class/bluetooth:/sys/class/bluetooth:ro
    depends_on:
      - mosquitto
    labels:
      - com.centurylinklabs.watchtower.scope=weekly

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /srv/hsb8/mounts/mosquitto/config:/mosquitto/config
      - /srv/hsb8/mounts/mosquitto/data:/mosquitto/data
      - /srv/hsb8/mounts/mosquitto/log:/mosquitto/log
    labels:
      - com.centurylinklabs.watchtower.scope=weekly

  # Watchtower REMOVED 2026-08-01 (OPS-125): image updates now come from the
  # composeStack autoUpdate timer — compose pull + up -d, Sat 05:00, through
  # compose itself. Its HTTP update API went with it: the token's consumer
  # (fleetcom-agent / bosun, FLEET-1397) is archived, so the API was an
  # orphaned write-channel into the docker socket. The scope=weekly labels on
  # services stay — inert, and removing them would force-recreate everything.
