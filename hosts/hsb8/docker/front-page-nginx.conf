# OPS-506: hsb8 mirror of hsb0's front page, without a HostDash status source.
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Run access checks before redirecting, as for the legacy /ops routes.
    location = /hostdash {
        allow 192.168.1.0/24;
        allow 100.64.0.0/10;
        deny all;
        try_files "" @hostdash_redirect;
    }
    location @hostdash_redirect {
        allow 192.168.1.0/24;
        allow 100.64.0.0/10;
        deny all;
        absolute_redirect off;
        return 301 /hostdash/$is_args$args;
    }
    location /hostdash/ {
        allow 192.168.1.0/24;
        allow 100.64.0.0/10;
        deny all;
        alias /usr/share/nginx/html/;
        autoindex off;
    }
    # Keep the root resources for hausnetz's HostDash enrichment and open boards.
    location = /config.js {
        allow 192.168.1.0/24;
        allow 100.64.0.0/10;
        deny all;
        try_files $uri =404;
    }
    location = /manifest.json {
        allow 192.168.1.0/24;
        allow 100.64.0.0/10;
        deny all;
        try_files $uri =404;
    }

    include /etc/nginx/hostdash-extra/*.conf;
}
