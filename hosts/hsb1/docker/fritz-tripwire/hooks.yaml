# webhook (adnanh/webhook) config for fritz-tripwire.
#
# Expected POST body (set in Uptime Kuma's "Custom Body" template):
#   { "ip": "192.168.1.7", "monitor": "Fritz.7 bz-repeater", "status": "Down" }
#
# msg must NOT appear in that body. Free-text {{ msg }} breaks the JSON on DOWN
# events — a ping failure expands to multi-line output, and raw newlines inside a
# JSON string value make the whole body unparseable, so no arguments reach run.sh
# and every DOWN lands as fritz-unknown-<ts>. UP events have an empty msg, which
# is why only they ever worked. run.sh gates DOWN-only via $3=status.
#
# 🔴 Was diagnosed 2026-06-04 (NIX-146) and this comment claimed it fixed, but the
# removal was never applied to the live Kuma notification — every DOWN stayed
# broken until 2026-08-09 (OPS-161). The body lives in Kuma's own DB on hsb0, not
# in nixcfg, so this file cannot enforce it: treat the comment as documentation of
# intent, and verify the real thing in Kuma → Settings → Notifications.
- id: fritz-down
  execute-command: /usr/local/bin/run.sh
  command-working-directory: /incidents
  response-message: "snapshot triggered\n"
  pass-arguments-to-command:
    - source: payload
      name: ip
    - source: payload
      name: monitor
    - source: payload
      name: status
