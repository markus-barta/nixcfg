# OPS-461 — Kinderzimmer 3D sketch (kig, Markus 2026-10-26), served by hsb1-home; same pattern as hsb0's
# /videos/ (OPS-380) and /inflight/ (OPS-353).
#
# Included inside the HostDash server block (modules/files/hostdash-nginx.conf, include point
# /etc/nginx/hostdash-extra/*.conf). LAN + tailnet only.
# Content: one self-contained index.html in /var/lib/kig (mba, 0755), pushed from the workstation atomically
# (scp to .index.html.tmp, then mv); no rebuild per content change. Dotfiles are never served.

location = /kig {
    absolute_redirect off;
    return 301 /kig/;
}

location /kig/ {
    alias /srv/kig/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        return 404;
    }
}
