# OPS-729: retain the complete HostDash document root, including config.js,
# manifest.json and status/status.json. This replaces nginx's default server.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /fernsehen {
        return 302 /fernsehen/;
    }

    # Only flat video filenames are public: no metadata, upload temporaries,
    # trash, directory listings or symlinks. nginx handles Range/HEAD itself.
    location ~ ^/fernsehen/video/(?!\.)([^/]+\.(?i:mp4|m4v|mov))$ {
        alias /data/$1;
        disable_symlinks on;
        autoindex off;
        limit_except GET { deny all; }
        types { video/mp4 mp4 m4v; video/quicktime mov; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        # Recording filenames must not appear in routine request logs.
        access_log off;
    }

    location /fernsehen/video/ {
        return 404;
    }

    location /fernsehen/ {
        proxy_intercept_errors on;
        error_page 502 504 /fernsehen-offline.html;
        # Re-resolve after a media-container replacement during weekly updates.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $media_backend http://hsb9-media:8080;
        proxy_pass $media_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    # Served by nginx even when the app is offline; no upstream or assets needed.
    location = /fernsehen-offline.html {
        internal;
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fernsehaufnahmen</title><body style="font:22px/1.5 sans-serif;padding:1em;color:#17252c;background:#f3f5f6"><h1>Fernsehaufnahmen</h1><p>Die Aufnahmen sind gerade nicht erreichbar. Bitte in einem Moment erneut versuchen.</p><p>Wenn das Problem bleibt, bitte die Betreuung verständigen.</p><p><a href="/fernsehen/">Erneut versuchen</a> · <a href="/">Zur Startseite</a></p></body></html>';
    }
}
