experimental:
  plugins:
    cloudflarewarp:
      modulename: github.com/BetterCorp/cloudflarewarp
      version: v1.3.3

entryPoints:
  traefik-api:
    address: "127.0.0.1:8099"
  web:
    address: ":80"
  web-secure:
    address: ":443"
    http:
      # OPS-354 item 1: requires Traefik >=3.7.12; OPS verifies the running
      # version before cutover because the compose image intentionally floats.
      aliasHeadersStrategy: delete
    http3: {}
    transport:
      respondingTimeouts:
        readTimeout: 10s
  mqtt:
    address: ":8883"
    transport:
      # https://doc.traefik.io/traefik/routing/entrypoints/#transport
      # https://doc.traefik.io/traefik/migration/v2/#v2112
      # I get "Error while Peeking first byte: read tcp" with the default
      respondingTimeouts:
        # idleTimeout: 3600
        readTimeout: 0

providers:
  docker:
    endpoint: "tcp://docker-proxy-traefik:2375"
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  default:
    acme:
      email: markus@barta.com
      storage: /etc/traefik/acme/acme.json
      #      httpChallenge:
      #        entryPoint: web
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0

  public-http:
    acme:
      email: markus@barta.com
      storage: /etc/traefik/acme/acme-http.json
      httpChallenge:
        entryPoint: web

# Capability-bearing routers must never use debug/request capture.
log:
  level: INFO

api:
  dashboard: false
