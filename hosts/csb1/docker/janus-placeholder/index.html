<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Janus · coming back soon</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d2321;--muted:#5b6461;--line:#d9d7cf}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--fg:#e8ebe9;--muted:#9aa3a0;--line:#2c3230}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
main{max-width:34rem;text-align:center}
.mark{width:56px;height:56px;margin:0 auto 20px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted)}
h1{font-size:1.6rem;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">J</div>
<h1>Janus is being rebuilt</h1>
<p>It will be back soon.</p>
</main>
</body>
</html>
