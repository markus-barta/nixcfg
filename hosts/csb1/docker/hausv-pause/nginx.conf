# HAUSV-918 / OPS-675: every GET path serves the approved immutable page with
# status 200, including old deep links and asset URLs. Only /healthz differs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    default_type text/html;
    charset utf-8;
    etag off;
    if_modified_since off;
    max_ranges 0;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-store, no-transform" always;
        error_page 405 =200 /index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "hausv-pause ok\n";
        }

        location / {
            try_files /index.html =500;
        }
    }
}
