<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Hausportal</title>
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1d1d1b;
    --muted: #5a5954;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --fg: #ecebe7;
      --muted: #a9a7a1;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    box-sizing: border-box;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 32rem; text-align: center; }
  h1 {
    margin: 0 0 1rem;
    font-size: clamp(1.625rem, 4vw, 2.25rem);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0;
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Das Hausportal macht Pause</h1>
  <p>Es wird gerade neu aufgebaut und ist bis dahin nicht erreichbar. Alle Daten bleiben sicher aufbewahrt.</p>
</main>
</body>
</html>
