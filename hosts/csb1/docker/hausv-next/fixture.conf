# NIX-368 / HAUSV-513: deterministic, intentionally fake values mirrored from
# hausv-org scripts/snapshot/env.sh. No production secret belongs in this file.
BASE_URL=http://100.64.0.4:8099
# The slot binds directly to the tailnet address with no reverse proxy in front
# (traefik.enable=false). BASE_URL is therefore "public" by the application's
# test (isLocalHost is false), which makes TRUSTED_PROXY_CIDRS mandatory —
# auth_hardening.go refuses to start otherwise, and refuses an empty list or
# 0.0.0.0/0 as well. Loopback only is the honest answer: it satisfies the
# contract while trusting nothing that can actually reach this container, so no
# workload on the tailnet or on a Docker network can spoof a client identity.
TRUSTED_PROXY_CIDRS=127.0.0.1/32,::1/128
ADDR=:8080
ROOT_DOMAIN=hausv.test
DEFAULT_TENANT=demo
LOCAL_DEV_LOGIN=true
