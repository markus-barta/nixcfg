# NIX-368 / HAUSV-513: intentionally separate from both the csb1 stack and
# the private production HAUSV project. This file must not gain external
# networks, Traefik labels, public binds, secrets or production mounts.
name: hausv-next

services:
  app:
    build:
      context: ${HAUSV_NEXT_CONTEXT:?set by hausv-next}
      dockerfile: Dockerfile.preview
      args:
        APP_VERSION: next-${HAUSV_NEXT_LABEL:?set by hausv-next}
        GIT_COMMIT: ${HAUSV_NEXT_LABEL:?set by hausv-next}
    image: hausv-next:${HAUSV_NEXT_RELEASE_ID:?set by hausv-next}
    container_name: hausv-next
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - /etc/hausv-next/fixture.conf
    volumes:
      - hausv-next-data:/data
    ports:
      - target: 8080
        published: "8099"
        host_ip: 100.64.0.4
        protocol: tcp
    networks:
      - fixture-only
    healthcheck:
      test:
        ["CMD", "/hausv-org", "healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.enable=false

  fixture:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    command: ["node", "/src/scripts/snapshot/fake-ha.mjs", "8102"]
    user: "65532:65532"
    restart: unless-stopped
    network_mode: service:app
    volumes:
      - ${HAUSV_NEXT_CONTEXT:?set by hausv-next}:/src:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.enable=false

  # BASE_URL is public by the application's test, so it refuses to start without
  # SMTP or OIDC (server.go:1364). The slot has neither and must not gain a real
  # one. This fixture accepts and discards mail on loopback inside the app's own
  # network namespace, which satisfies the contract without any path off the
  # host (NIX-370).
  fixture-smtp:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    command: ["node", "/src/scripts/snapshot/fake-smtp.mjs", "8123", "8124"]
    user: "65532:65532"
    restart: unless-stopped
    network_mode: service:app
    volumes:
      - ${HAUSV_NEXT_CONTEXT:?set by hausv-next}:/src:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false
      - com.centurylinklabs.watchtower.enable=false

volumes:
  hausv-next-data:
    name: hausv-next-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/hausv-next/data

networks:
  # NOT internal. Docker's `internal: true` gives a network no external
  # connectivity, and that also disables host port publishing — the binding is
  # accepted, silently never established, and the container still reports
  # healthy. That is exactly how this slot spent its first deploys: healthy,
  # serving /healthz inside, unreachable from the tailnet (NIX-370).
  #
  # Egress isolation was a nice-to-have; reachability is the slot's entire
  # purpose. The protections that actually matter are unchanged: the port is
  # bound only to the tailnet address, the data is fixtures, no production path
  # or secret is mounted, and Traefik is disabled. The application is also
  # configured with no external endpoints — HA, Telegram and OIDC are blank and
  # SMTP and map tiles point at loopback fixtures.
  fixture-only:
    name: hausv-next-fixture-only
