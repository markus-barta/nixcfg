# OPS-340: jhw22-wp.hausv.org, a public static page (one index.html) for a private WEG heat-pump project.
# Public by decision (Markus 2026-10-15): the in-page PIN is the only gate; the page must carry no data traceable
# to a person or party (reviewed by OPS before every publish). Kept out of search engines.

# OPS-343: a 404 must never be cached (Cloudflare caches .webp etc. by extension); found images stay cacheable.
map $status $jhw22_wp_cache_control {
    404     "no-store";
    default "";
}

server {
    listen 80;
    server_name _;
    # OPS-343: content on the host (copy deploys); `current` is a relative symlink to releases/<id>.
    root /srv/jhw22-wp/current;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        try_files $uri /index.html;
    }
    # OPS-343: a missing image is a 404, never the index.html fallback. On 2026-10-15 a request for an image
    # that only the next version contained got index.html as 200, and Cloudflare cached that HTML under the
    # .webp URL for its 2 h default edge TTL. add_header in a location replaces the server-level ones, so
    # they are repeated here; an empty Cache-Control value is not sent.
    location /img/ {
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control $jhw22_wp_cache_control always;
    }
}
