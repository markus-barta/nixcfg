name: Propose coordinated Pharos fleet release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional annotated Pharos release tag (latest when empty)
        required: false
        type: string
      dry_run:
        description: Verify resolution, signature, updates, and tests without opening pull requests
        required: false
        default: false
        type: boolean

concurrency:
  group: pharos-release-rollout
  cancel-in-progress: false

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  propose:
    if: github.repository == 'markus-barta/nixcfg' || github.repository == 'inspr-at/nixcfg'
    runs-on: ubuntu-24.04
    env:
      DSCCFG_REPOSITORY: inspr-at/dsccfg
      GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
    steps:
      - name: Require the reviewed cross-repository credential
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'error: GH_TOKEN_FOR_UPDATES is not configured' >&2
            exit 1
          fi

      - name: Checkout nixcfg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          ref: main
          fetch-depth: 0

      - name: Checkout dsccfg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DSCCFG_REPOSITORY }}
          ref: main
          path: _release-dsccfg
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          fetch-depth: 0

      - name: Resolve one annotated Pharos release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag=$REQUESTED_TAG
          if [[ -z "$tag" ]]; then
            tag=$(
              gh api --paginate repos/inspr-at/pharos/git/matching-refs/tags/v \
                --jq '.[].ref' |
                sed 's#^refs/tags/##' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1
            )
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'error: no valid semantic Pharos release tag resolved' >&2
            exit 1
          fi
          object_type=$(gh api "repos/inspr-at/pharos/git/ref/tags/${tag}" --jq '.object.type')
          if [[ "$object_type" != tag ]]; then
            echo 'error: Pharos release tag is not annotated' >&2
            exit 1
          fi
          tag_object=$(gh api "repos/inspr-at/pharos/git/ref/tags/${tag}" --jq '.object.sha')
          commit_sha=$(gh api "repos/inspr-at/pharos/git/tags/${tag_object}" --jq '.object.sha')
          ancestry=$(gh api "repos/inspr-at/pharos/compare/${commit_sha}...main" --jq '.status')
          if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
            echo 'error: Pharos release tag is not on the main lineage' >&2
            exit 1
          fi
          version=${tag#v}
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >>"$GITHUB_OUTPUT"

      - name: Resolve the public immutable image digest
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          image=ghcr.io/inspr-at/pharos/pharosd
          digest=$(
            docker buildx imagetools inspect "${image}:${VERSION}" |
              awk '$1 == "Digest:" { print $2; exit }'
          )
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'error: published Pharos image has no immutable sha256 digest' >&2
            exit 1
          fi
          printf 'digest=%s\nreference=%s\n' "$digest" "${image}:${VERSION}@${digest}" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.5.2

      - name: Install Nix for production preflight
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Verify the release signature and workflow identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cosign verify "ghcr.io/inspr-at/pharos/pharosd@${DIGEST}" \
            --certificate-identity "https://github.com/inspr-at/pharos/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null

      - name: Select an exact existing proposal pair
        id: existing
        env:
          NIXCFG_REPOSITORY: ${{ github.repository }}
          REFERENCE: ${{ steps.image.outputs.reference }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/select-pharos-release-candidates.sh \
            "$VERSION" \
            "$REFERENCE" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/_release-dsccfg" \
            "$GITHUB_OUTPUT"

      - name: Prepare both repositories from the same digest
        if: steps.existing.outputs.reused != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/update-pharos-release.sh "$VERSION" "$DIGEST"
          _release-dsccfg/scripts/update-pharos-release.sh --root _release-dsccfg "$VERSION" "$DIGEST"
          nix_ref=$(jq -r '.reference' pharos-release.json)
          dsc_ref=$(jq -r '.reference' _release-dsccfg/pharos-release.json)
          if [[ "$nix_ref" != "$dsc_ref" ]]; then
            echo 'error: paired Pharos release manifests diverged' >&2
            exit 1
          fi

      - name: Prepare clean local release candidates
        if: steps.existing.outputs.reused != 'true'
        id: prepared
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/prepare-pharos-release-candidates.sh \
            "$VERSION" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/_release-dsccfg"

      - name: Validate the exact committed candidates
        env:
          DSC_SHA: ${{ steps.existing.outputs.dsc_sha || steps.prepared.outputs.dsc_sha }}
          NIX_SHA: ${{ steps.existing.outputs.nix_sha || steps.prepared.outputs.nix_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$NIX_SHA" ]]
          [[ "$(git -C _release-dsccfg rev-parse HEAD)" == "$DSC_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          [[ -z "$(git -C _release-dsccfg status --porcelain --untracked-files=no)" ]]
          tests/T20-pharos-beacon-healthcheck.sh
          tests/T21-pharos-release-rollout.sh
          tests/T22-pharos-release-update.sh
          tests/T32-managed-secret-production-preflight.sh
          _release-dsccfg/tests/pharos-release-rollout.sh
          _release-dsccfg/tests/pharos-release-update.sh

      - name: Record dry-run evidence
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "pharos_release_rollout=dry_run_passed version=${VERSION} digest=${DIGEST}"

      - name: Publish both validated proposals transactionally
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        id: proposals
        env:
          DSC_BRANCH: ${{ steps.existing.outputs.dsc_branch || steps.prepared.outputs.dsc_branch }}
          DSC_CHANGED: ${{ steps.existing.outputs.dsc_changed || steps.prepared.outputs.dsc_changed }}
          DSC_SHA: ${{ steps.existing.outputs.dsc_sha || steps.prepared.outputs.dsc_sha }}
          DSCCFG_ROOT: ${{ github.workspace }}/_release-dsccfg
          NIX_BRANCH: ${{ steps.existing.outputs.nix_branch || steps.prepared.outputs.nix_branch }}
          NIX_CHANGED: ${{ steps.existing.outputs.nix_changed || steps.prepared.outputs.nix_changed }}
          NIX_SHA: ${{ steps.existing.outputs.nix_sha || steps.prepared.outputs.nix_sha }}
          NIXCFG_REPOSITORY: ${{ github.repository }}
          NIXCFG_ROOT: ${{ github.workspace }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/publish-pharos-release-candidates.sh
