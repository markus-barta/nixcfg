name: Janus staged engine pin check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/janus-engine-pin-check.yml"
      - "hosts/csb1/docker/docker-compose.yml"
      - "hosts/csb1/docker/janus/nonprod-smoke/README.md"
      - "hosts/csb1/docs/RUNBOOK.md"
      - "justfile"
      - "scripts/janus-engine-pin-check.sh"
  pull_request:
    paths:
      - ".github/workflows/janus-engine-pin-check.yml"
      - "hosts/csb1/docker/docker-compose.yml"
      - "hosts/csb1/docker/janus/nonprod-smoke/README.md"
      - "hosts/csb1/docs/RUNBOOK.md"
      - "justfile"
      - "scripts/janus-engine-pin-check.sh"

permissions:
  contents: read

jobs:
  pin-check:
    name: staged pin matches latest verified release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run staged engine pin drift check
        env:
          # The Janus repository is private. Use the existing cross-repository
          # read token; the current-repository GITHUB_TOKEN cannot read it.
          JANUS_ENGINE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: scripts/janus-engine-pin-check.sh
