name: Janus retained engine pin check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/janus-engine-pin-check.yml"
      - "hosts/csb1/docker/compose-spec.nix"
      - "hosts/csb1/shared-flow.nix"
      - "hosts/csb1/docker/janus-placeholder/**"
      - "hosts/csb1/docker/janus/managed-service-production/release-admission.json"
      - "hosts/csb1/docker/janus/managed-service-production/release-channels-v1.json"
      - "hosts/csb1/docker/janus/nonprod-smoke/README.md"
      - "hosts/csb1/docs/RUNBOOK.md"
      - "justfile"
      - "scripts/janus-engine-pin-check.sh"
      - "scripts/janus-engine-pin-check.py"
      - "tests/T112-janus-engine-pin-check.sh"
      - "tests/test_janus_engine_pin_check.py"
  pull_request:
    paths:
      - ".github/workflows/janus-engine-pin-check.yml"
      - "hosts/csb1/docker/compose-spec.nix"
      - "hosts/csb1/shared-flow.nix"
      - "hosts/csb1/docker/janus-placeholder/**"
      - "hosts/csb1/docker/janus/managed-service-production/release-admission.json"
      - "hosts/csb1/docker/janus/managed-service-production/release-channels-v1.json"
      - "hosts/csb1/docker/janus/nonprod-smoke/README.md"
      - "hosts/csb1/docs/RUNBOOK.md"
      - "justfile"
      - "scripts/janus-engine-pin-check.sh"
      - "scripts/janus-engine-pin-check.py"
      - "tests/T112-janus-engine-pin-check.sh"
      - "tests/test_janus_engine_pin_check.py"

permissions:
  contents: read

jobs:
  pin-check:
    name: retained pins verified and Janus app declared retired
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@7ac1ec25491415c381d9b62f0657c7a028df52a7 # v24

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify retained engine pins and retired app configuration
        env:
          # The Janus repository is private. Use the existing cross-repository
          # read token; the current-repository GITHUB_TOKEN cannot read it.
          JANUS_ENGINE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: scripts/janus-engine-pin-check.sh
