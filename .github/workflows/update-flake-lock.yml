name: ⤴️ Update flake.lock
on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "0 3 * * 0" # Runs every Sunday at 3am UTC

jobs:
  update-and-merge:
    name: Update and Auto-Merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main @ 2026-07-23
      - name: Prefetch locked Paimos inputs (OPS-480)
        uses: ./.github/actions/paimos-private-inputs
        with:
          paimos-key: ${{ secrets.PAIMOS_DEPLOY_KEY }}
          paimos-legacy-key: ${{ secrets.PAIMOS_LEGACY_DEPLOY_KEY }}
          require-keys: "true"

      - name: Select automatically updated inputs (OPS-207)
        # OPS-506: both hausnetz pins stay fixed and need no key here. Release-pinned Paimos
        # inputs stay fixed; prefetch warms their exact NARs but cannot authorize
        # resolving new private tags. GH_TOKEN_FOR_UPDATES manages only the PR.
        id: inputs
        run: |
          inputs=$(jq -r '.nodes[.root].inputs | to_entries | map(select(.key != "hausnetz" and .key != "hausnetz-hsb8" and .key != "aeon" and .key != "paimos" and (.value | type == "string")) | .key) | sort | join(" ")' flake.lock)
          test -n "$inputs"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@ec13d37c32ca75bc750ecc133e944e5a18164688 # main @ 2026-07-23
        with:
          inputs: ${{ steps.inputs.outputs.inputs }}
          # https://github.com/DeterminateSystems/update-flake-lock?tab=readme-ov-file#with-a-personal-authentication-token
          # Token needed so it can trigger the check workflow
          # Also see https://github.com/orgs/community/discussions/65321
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          commit-msg: "flake: update" # Commit message to be used
          pr-title: "Update flake.lock" # Title of PR to be created
          pr-labels: | # Labels to be set on the PR
            dependencies
            automated
          # git-author-name: 'Patrizio Bekerle'
          # git-author-email: 'patrizio@bekerle.com'
          # git-committer-name: 'Patrizio Bekerle'
          # git-committer-email: 'patrizio@bekerle.com'

      # Auto-merge the PR immediately (user doesn't want manual merges)
      # Tracking for this policy lives in PPM (`pm.barta.cm`)
      - name: Auto-merge PR
        if: steps.update.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.update.outputs.pull-request-number }} \
            --merge \
            --delete-branch \
            --admin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
