name: Pharos host settings

on:
  workflow_dispatch:
    inputs:
      host:
        description: Existing nixcfg host name
        required: true
        type: string
      accent:
        description: Six-digit host accent color
        required: true
        type: string
      kind:
        description: Expected host availability
        required: true
        type: choice
        options:
          - server
          - workstation
      suppress_down:
        description: Suppress heartbeat-down alerts
        required: true
        default: false
        type: boolean
      suppress_backup:
        description: Suppress backup alerts
        required: true
        default: false
        type: boolean
      suppress_nix_freshness:
        description: Suppress Nix freshness alerts
        required: true
        default: false
        type: boolean
      request_id:
        description: Pharos request correlation id
        required: true
        type: string

concurrency:
  group: pharos-host-settings-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  update-and-merge:
    name: Validate, open PR, and merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PHAROS_HOST: ${{ inputs.host }}
      PHAROS_ACCENT: ${{ inputs.accent }}
      PHAROS_KIND: ${{ inputs.kind }}
      PHAROS_SUPPRESS_DOWN: ${{ inputs.suppress_down }}
      PHAROS_SUPPRESS_BACKUP: ${{ inputs.suppress_backup }}
      PHAROS_SUPPRESS_NIX_FRESHNESS: ${{ inputs.suppress_nix_freshness }}
      PHAROS_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Checkout nixcfg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Apply narrow settings change
        run: |
          scripts/update-pharos-host-settings.sh \
            "$PHAROS_HOST" \
            "$PHAROS_ACCENT" \
            "$PHAROS_KIND" \
            "$PHAROS_SUPPRESS_DOWN" \
            "$PHAROS_SUPPRESS_BACKUP" \
            "$PHAROS_SUPPRESS_NIX_FRESHNESS" \
            "$PHAROS_REQUEST_ID"

      # NIX-402: NIX-348 deliberately rejects dirty flake evaluations because
      # they have no canonical self.rev. Keep each proposed state commit-backed
      # before asking Nix to evaluate it. create-pull-request preserves commits
      # made by the workflow and pushes them to the automation branch.
      - name: Commit proposed settings for validation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/pharos-host-preferences.json
          if ! git diff --cached --quiet --exit-code; then
            git commit -m "pharos: stage $PHAROS_HOST host settings for validation"
          fi

      - name: Regenerate and commit declared hsb8 manifest
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          nix eval --no-update-lock-file \
            .#nixosConfigurations.hsb8.config.services.hostdash.manifest.generated \
            --json | jq -S . >"$manifest"
          chmod 0644 "$manifest"
          mv "$manifest" hosts/csb1/docker/pharos/manifests/hsb8.json
          git add hosts/csb1/docker/pharos/manifests/hsb8.json
          if ! git diff --cached --quiet --exit-code; then
            git commit -m 'pharos: regenerate declared hsb8 manifest'
          fi

      - name: Validate schema and target configuration
        run: |
          set -euo pipefail
          tests/T08-pharos-host-preferences.sh
          bash tests/T05-hostdash-manifest.sh
          nix eval --no-update-lock-file \
            ".#nixosConfigurations.${PHAROS_HOST}.config.system.build.toplevel.drvPath" \
            >/dev/null
          git diff --exit-code -- \
            modules/pharos-host-preferences.json \
            hosts/csb1/docker/pharos/manifests/hsb8.json

      - name: Create settings pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          add-paths: |
            modules/pharos-host-preferences.json
            hosts/csb1/docker/pharos/manifests/hsb8.json
          branch: automation/pharos-settings-${{ inputs.host }}
          delete-branch: true
          commit-message: "pharos: update ${{ inputs.host }} host settings"
          title: "Pharos: update ${{ inputs.host }} host settings"
          body: |
            Automated safe host-settings request from Pharos.

            Host: `${{ inputs.host }}`
            Request: `${{ inputs.request_id }}`

            This PR changes declarative metadata only. It does not deploy or rebuild a host.
          labels: automated

      - name: Wait for pull request checks
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          check_count=0
          for _ in $(seq 1 30); do
            checks=$(gh pr checks "$PR_NUMBER" --json name,bucket 2>/dev/null || true)
            check_count=$(jq 'length' <<<"${checks:-[]}")
            if ((check_count > 0)); then
              break
            fi
            sleep 2
          done
          if ((check_count == 0)); then
            echo "No pull request checks started" >&2
            exit 1
          fi
          gh pr checks "$PR_NUMBER" --watch --fail-fast --interval 10

      - name: Merge validated pull request
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --merge --delete-branch

      - name: Record durable outcome
        id: outcome
        env:
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            outcome=merged
          else
            outcome=already_declared
          fi
          outcome_file="$RUNNER_TEMP/pharos-host-settings-outcome.json"
          scripts/write-pharos-host-settings-outcome.sh \
            "$PHAROS_HOST" \
            "$PHAROS_REQUEST_ID" \
            "$outcome" \
            "$PR_NUMBER" \
            "$outcome_file"
          echo "path=$outcome_file" >>"$GITHUB_OUTPUT"
          {
            echo "settings_change=$outcome"
            echo "request_id=$PHAROS_REQUEST_ID"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish correlated outcome
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pharos-host-settings-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.outcome.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
