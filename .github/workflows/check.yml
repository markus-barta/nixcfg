name: 🔎️ Check flake for all systems

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docker/**"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docker/**"

# Cancel superseded runs on the same ref (rapid re-pushes) so obsolete runs are
# cancelled instead of running to a failure that emails the repo owner. Never
# cancel on main, so post-merge checks always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pharos-rollout:
    name: Pharos fleet release compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@7ac1ec25491415c381d9b62f0657c7a028df52a7 # v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify Pharos beacon healthcheck contract
        run: tests/T20-pharos-beacon-healthcheck.sh

      - name: Reject mixed or mutable Pharos fleet pins
        run: tests/T21-pharos-release-rollout.sh

      - name: Verify deterministic Pharos fleet release updates
        run: tests/T22-pharos-release-update.sh

      - name: Verify clean transactional Pharos release proposals
        run: tests/T51-pharos-release-proposals.sh

      - name: Verify Janus container least privilege and shell-free runtime
        run: tests/T23-janus-container-hardening.sh

      - name: Verify Janus production role authorization deployment
        run: tests/T19-janus-role-deployment.sh

      - name: Reject deprecated NixOS host-platform and scripted-initrd options
        run: tests/T24-nixos-deprecation-cleanup.sh

      - name: Enforce IR bridge destination and log boundaries
        run: tests/T25-ir-bridge-boundaries.sh

      - name: Enforce funkeykid config and sound path boundaries
        run: tests/T26-funkeykid-path-boundaries.sh

      - name: Reject mutable GitHub Actions references
        run: tests/T27-github-actions-pins.sh

      - name: Verify the Pharos provisioning executor boundary
        run: tests/T28-pharos-provisioning-executor.sh

      - name: Verify the Pharos Janus consumer projection boundary
        run: tests/T29-pharos-janus-consumer-boundary.sh

      - name: Verify managed-service declaration generation
        run: nix-shell -p ripgrep --run tests/T30-managed-service-manifest.sh

      - name: Verify Janus host-envelope module
        run: tests/T31-janus-host-envelope.sh

      - name: Verify managed-secret production preflight
        run: nix-shell -p ripgrep --run tests/T32-managed-secret-production-preflight.sh

      - name: Keep Traefik ACME bind sources boot-safe
        run: tests/T30-traefik-acme-storage.sh

      - name: Verify tests guard against bash 3.2 false passes
        run: tests/T33-bash-version-guards.sh

      - name: Verify HAUSV snapshot and application alerts
        run: tests/T34-hausv-alerts.sh

      - name: Verify HAUSV graceful-stop budget
        run: tests/T36-hausv-stop-grace.sh

      - name: Verify csb1 tailnet witness contract (OPS-181)
        run: tests/T44-tailnet-watch.sh

      - name: Verify Pharos deployment evidence reaches beacons through a directory (OPS-186)
        run: tests/T45-pharos-evidence-mount.sh

      - name: Verify csb1 fleet drift watch contract (OPS-187)
        run: tests/T46-fleet-drift.sh

      # OPS-188: contract tests that existed but ran nowhere. An unwired test is
      # prose: T10 had been passing on deleted files, T38 still asserted the
      # pre-OPS-186 evidence mount, and T41 asserted the opposite of its own
      # rule — none of it visible because none of it ran.
      - name: Verify SSH route matrix (OPS-146)
        run: tests/T04-markus-ssh-routes.sh

      - name: Verify Janus/Pharos env-file boundary
        run: tests/T06-janus-pharos-env-file.sh

      - name: Verify Pharos auth bootstrap
        run: tests/T07-pharos-auth-bootstrap.sh

      - name: Verify speedtest-tracker secret boundary (NIX-290)
        run: tests/T09-speedtest-tracker-secret-boundary.sh

      - name: Verify no legacy whoami in production (NIX-292)
        run: tests/T10-no-production-whoami.sh

      - name: Verify Pharos kernel posture
        run: tests/T11-pharos-kernel-posture.sh

      - name: Verify csb0 restic wrapper behaviour (NIX-294)
        run: tests/T12-csb0-restic-wrapper.sh

      - name: Verify Pharos guarded deploy wiring
        run: tests/T13-pharos-guarded-deploy.sh

      - name: Verify Pharos action agent behaviour
        run: tests/T15-pharos-action-agent.sh

      - name: Verify Janus/Pharos retirement wiring
        run: tests/T17-janus-pharos-retirement.sh

      - name: Verify Pharos retirement executor behaviour
        run: tests/T18-pharos-retirement-executor.sh

      - name: Verify managed-secret readiness verdict discipline
        run: tests/T33-managed-secret-readiness-verdict.sh

      - name: Verify csb0 ops-alerts poller contract (OPS-104/107/115)
        run: tests/T35-ops-alerts.sh

      - name: Verify revision traceability (OPS-106 / NIX-348)
        run: tests/T36-revision-traceability.sh

      - name: Verify compose-stack contract and YAML equivalence (OPS-116/117)
        run: nix-shell -p yq-go --run tests/T37-compose-stack.sh

      - name: Verify Pharos deployment evidence wiring (NIX-348 / OPS-186)
        run: tests/T38-pharos-deployment-evidence.sh

      - name: Verify static uid/gid collision gate (NIX-354)
        run: tests/T39-static-id-gate.sh

      - name: Verify agenix declarations match ciphertext recipients (OPS-188)
        run: tests/T47-agenix-recipient-integrity.sh

      - name: Verify Paimos external-stage adapter contract (NIX-381 / PAI-810)
        run: tests/T48-paimos-delivery-stage.sh

      - name: Verify declared host health thresholds (NIX-281)
        run: tests/T49-host-health-thresholds.sh

      - name: Verify Grok Bot plugin never renders absent usage as 0% (OPS-192)
        run: tests/T50-codexbar-grokbot-plugin.sh

      - name: Verify HostDash host-side HTTP status evidence (NIX-343)
        run: tests/T52-hostdash-http-status.sh

      - name: Verify HostDash four-host status parity (NIX-393 / HOSTD-14)
        run: nix-shell -p bash jq nodejs --run tests/T59-hostdash-status-fleet.sh

      # 🟡 Temporary — successor is a multi-path mode in inspr-modules'
      # doctrine-check.sh (INSPR-300); this step then calls that instead.
      - name: Verify both doctrine consumption paths agree
        run: tests/T42-doctrine-paths-agree.sh

      - name: Verify fleet-safe doctrine-private boundary
        run: nix-shell -p bash fish --run "bash tests/T54-doctrine-private-fleet-boundary.sh"

      - name: Verify operator inspr CLI fleet configuration
        run: tests/T55-inspr-cli-fleet-config.sh

      - name: Verify mbp2607 Paimos agentd Home Manager contract
        run: nix-shell -p python3 --run tests/T56-paimos-agentd-home-manager.sh

      - name: Verify csb1 Paimos production identity firewall
        run: nix-shell -p python3 --run tests/T57-paimos-production-identity.sh

      - name: Verify headscale DERP-map fallback contract (OPS-180)
        run: nix-shell -p python3Packages.pyyaml --run tests/T43-headscale-derp-fallback.sh

      - name: Verify HAUSV PostgreSQL Phase-0 contract
        run: tests/T40-hausv-postgres.sh

      - name: Verify HAUSV tailnet fixture preview contract
        run: tests/T41-hausv-next.sh

  check:
    name: 🔎️ Eval flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        host:
          # Active hosts only (must match flake.nix nixosConfigurations)
          - hsb0
          - hsb1
          - hsb8
          - hsb9
          - csb0
          - csb1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@7ac1ec25491415c381d9b62f0657c7a028df52a7 # v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run nix eval for ${{ matrix.host }}
        # We don't want to continue on error of the workflow will not fail if one host fails
        # continue-on-error: true
        # CI must be read-only: the local nixhostforge stub is intentionally
        # mutable in flake.lock, so newer Nix versions fail if eval tries to
        # refresh the lock file.
        run: nix eval --no-update-lock-file .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath

  # ============================================================================
  # NIX-373 — a single stable required check for the whole eval matrix
  # ============================================================================
  # Why this exists: `🔎️ Eval flake` is a matrix, so it produces six check
  # names that encode the host (`🔎️ Eval flake (hsb0)` …). Requiring those
  # six in branch protection couples flake.nix's nixosConfigurations list to
  # repository settings — remove or rename a host and the required name never
  # reports again, blocking every PR with no obvious cause; add a host and its
  # check is silently not required. This job is one stable name instead.
  #
  # 🔴 `if: always()` is load-bearing, not decoration. Without it this job is
  # SKIPPED when the matrix fails — and on this repository a skipped required
  # check does NOT block a merge (proven: PR #354 merged with CodeQL NEUTRAL).
  # A naive `needs:` gate would therefore report "skipped" on precisely the
  # failure it exists to catch, and let the merge through. That is strictly
  # worse than six volatile names, because it looks like protection.
  #
  # It must also fail closed on `cancelled`, which is a live state here: this
  # workflow sets cancel-in-progress for non-main refs, so a rapid re-push
  # cancels the matrix. Asserting `= success` handles success/failure/skipped/
  # cancelled in one comparison.
  #
  # The six per-host checks still report individually, so per-host failure
  # detail is unchanged; only the *required* name is consolidated.
  eval-gate:
    name: 🔎️ Eval flake — all hosts
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert every host evaluated
        run: |
          result='${{ needs.check.result }}'
          echo "eval matrix result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::flake eval did not succeed for all hosts (result: ${result})"
            exit 1
          fi
          echo "all hosts evaluated successfully"
